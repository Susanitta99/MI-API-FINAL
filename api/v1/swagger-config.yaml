openapi: 3.0.0

info:
  title: MI API FINAL
  version: 1.0.0
  description: Documentación de la API

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        nombre:
          type: string
        email:
          type: string

    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: suzi@example.com
        password:
          type: string
          example: "123456"

    Token:
      type: object
      properties:
        token:
          type: string

paths:

  /api/v1/hello:
    get:
      summary: Devuelve un saludo
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Hola Mundo Bonito

  /api/v1/saludo:
    get:
      summary: Devuelve un saludo personalizado
      parameters:
        - name: nombre
          in: query
          required: true
          schema:
            type: string
          example: Suzi
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Hola, Suzi!

  /api/v1/login:
    post:
      summary: Inicia sesión y devuelve un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Token JWT generado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Credenciales incorrectas

  /api/v1/usuarios:
    get:
      summary: Devuelve la lista de usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          description: Token no proporcionado o inválido
          